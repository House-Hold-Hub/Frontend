server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Email bearer landing pages (security model, "Other bearer credentials"):
  # the verifier rides in the URI fragment, so these responses must never be
  # cached and must never send a referrer.
  location ~ ^/(verify-email|verify-email-change)/?$ {
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
