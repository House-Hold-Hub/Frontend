name: Temporary scaffold verification

on:
  push:
    branches:
      - feat/1-react-vite-scaffold

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Smoke-test dev server
        shell: bash
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vite.log
          exit 1

      - name: Build container image
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 -t householdhub-frontend:verify .

      - name: Commit generated npm lockfile
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push
          fi
